<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - VehicleRent</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="form-page">


    <div class="form-container">

        <div class="form-header">

            <h1>🚗 VehicleRent</h1>

            <p>Login to your account</p>

        </div>


        <form action="login" method="post"
              onsubmit="return validateLogin()">


            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="Enter your email"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter password"
                required>


            <button type="submit">
                Login
            </button>

        </form>


        <p class="form-bottom">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


        <p class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </p>

    </div>


    <script src="js/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - VehicleRent</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="form-page">


    <div class="form-container">

        <div class="form-header">

            <h1>🚗 VehicleRent</h1>

            <p>Create your account</p>

        </div>


        <form action="register" method="post"
              onsubmit="return validateRegister()">


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required>


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>


            <label>
                Mobile Number
            </label>

            <input
                type="text"
                id="mobile"
                name="mobile"
                placeholder="Enter mobile number"
                maxlength="10"
                required>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="form-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <p class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </p>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
